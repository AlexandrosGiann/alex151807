<style>
  :root{

    --success:#10b981; --danger:#ef4444; --warning:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);
       color:var(--text-main);padding:26px 16px 70px}
  .wrap{max-width:1080px;margin:0 auto}
  .top-nav{text-align:center;margin-bottom:16px}
  .top-nav a{color:var(--text-muted);text-decoration:none;margin:0 10px;font-size:.94rem}
  .top-nav a:hover{color:var(--primary)}
  h1.page-title{text-align:center;color:var(--primary);margin:0 0 6px;
                font-size:clamp(1.5rem,4vw,2.2rem)}
  .subtitle{text-align:center;color:var(--text-muted);margin:0 auto 24px;max-width:720px;
            line-height:1.6;font-size:.95rem}

  .panel{background:var(--card-bg);border:1px solid var(--border-color);
         border-radius:16px;padding:18px;margin-bottom:18px}
  .panel-h{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
           color:var(--text-muted);font-weight:700;margin:0 0 12px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#0b1220;color:var(--text-muted);border:1px solid var(--border-color);
        border-radius:999px;padding:8px 15px;cursor:pointer;font-size:.86rem;
        font-family:inherit;transition:all .16s ease}
  .chip:hover{color:var(--text-main);border-color:var(--primary)}
  .chip.on{background:var(--primary);color:#06283d;border-color:var(--primary);font-weight:700}
  .chip .cnt{opacity:.7;font-size:.78em;margin-left:5px}

  .opts{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
  .opt{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--text-muted)}
  .opt input[type=checkbox]{accent-color:var(--primary);width:17px;height:17px;cursor:pointer}
  .opt input[type=number]{width:66px;background:#0b1220;color:var(--text-main);
        border:1px solid var(--border-color);border-radius:8px;padding:6px 8px;font-family:inherit}
  .seg{display:inline-flex;border:1px solid var(--border-color);border-radius:10px;overflow:hidden}
  .seg button{background:#0b1220;color:var(--text-muted);border:0;padding:8px 15px;
        cursor:pointer;font-family:inherit;font-size:.86rem}
  .seg button.on{background:var(--primary);color:#06283d;font-weight:700}

  .btn{background:var(--primary);color:#06283d;border:0;border-radius:10px;padding:11px 22px;
       font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border-color)}
  .btn-ghost:hover:not(:disabled){color:var(--text-main);border-color:var(--primary)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* timer */
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;
         color:var(--primary);padding:6px 12px;border:1px solid var(--border-color);
         border-radius:10px;background:#0b1220}
  .timer.low{color:var(--danger);border-color:var(--danger)}

  /* word bank */
  #bank{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
  .word{background:#0b1220;border:1px solid var(--primary);color:var(--text-main);
        border-radius:9px;padding:8px 13px;cursor:grab;font-size:.87rem;user-select:none;
        transition:transform .12s ease,opacity .12s ease}
  .word:active{cursor:grabbing}
  .word.sel{background:var(--primary);color:#06283d;font-weight:700;transform:scale(1.04)}
  .word.used{display:none}

  /* set + slots */
  .set{margin-bottom:22px}
  .set-title{font-size:1rem;font-weight:700;margin:0 0 4px;color:var(--text-main)}
  .set-note{font-size:.8rem;color:var(--text-muted);margin:0 0 10px}
  .slots{display:grid;gap:8px}
  .slots.two{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .slot{display:flex;align-items:stretch;gap:0;border:1px solid var(--border-color);
        border-radius:10px;overflow:hidden;background:#0b1220;min-height:44px}
  .slot-label{flex:0 0 auto;min-width:92px;display:flex;align-items:center;justify-content:center;

        padding:8px 10px;border-right:1px solid var(--border-color);text-align:center}
  .slot-drop{flex:1;display:flex;align-items:center;padding:6px 10px;min-height:42px;
        font-size:.88rem;color:var(--text-muted)}
  .slot-drop.over{background:rgba(56,189,248,.14)}
  .slot-drop .placed{background:rgba(56,189,248,.16);border:1px solid var(--primary);
        border-radius:7px;padding:5px 10px;color:var(--text-main);cursor:pointer;font-size:.86rem}
  .slot-drop input{width:100%;background:transparent;border:0;color:var(--text-main);
        font-family:inherit;font-size:.88rem;outline:none;padding:4px 0}
  .slot.ok{border-color:var(--success)}
  .slot.ok .slot-label{background:rgba(16,185,129,.15);color:var(--success)}
  .slot.bad{border-color:var(--danger)}
  .slot.bad .slot-label{background:rgba(239,68,68,.15);color:var(--danger)}
  .fix{display:block;font-size:.78rem;color:var(--success);margin-top:3px}

  .score-box{text-align:center;padding:18px}
  .score-num{font-size:2.4rem;font-weight:800;color:var(--primary);margin:0}
  .score-sub{color:var(--text-muted);margin:6px 0 0;font-size:.92rem}

  .hidden{display:none !important}
  .float-btns{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:10px}
  .fbtn{width:44px;height:44px;border-radius:50%;background:var(--card-bg);
        border:1px solid var(--border-color);color:var(--text-muted);font-weight:700;
        cursor:pointer;font-family:inherit}
  .fbtn:hover{color:var(--text-main);border-color:var(--primary)}
  @media (max-width:600px){
    .slot-label{min-width:74px;font-size:.76rem}
    .slots.two{grid-template-columns:1fr}

</style>
</head>

/* =====================  i18n  ===================== */
const I18N = {
  el:{ navHome:'Αρχική', navQuiz:'Κουίζ', navCore:'AWS Quiz',
    title:'AWS Cloud Practitioner — Ορολογίες',
    subtitle:'Ταίριαξε κάθε περιγραφή με τη σωστή ορολογία AWS. Σύρε τις λέξεις ή γράψε την απάντηση — εξάσκηση για το CLF-C02.',
    pickSets:'Διάλεξε σύνολα', selectAll:'Επιλογή όλων', clearAll:'Καθαρισμός',
    optionsH:'Ρυθμίσεις', modeLabel:'Τρόπος:', modeDrag:'Σύρσιμο', modeType:'Πληκτρολόγηση',
    shuffleLabel:'Ανακάτεμα σειράς', timerLabel:'Χρονόμετρο', minsLabel:'λεπτά',
    startBtn:'Έναρξη', bankH:'Λέξεις', checkBtn:'Έλεγχος', retryBtn:'Καθαρισμός',
    backBtn:'← Ρυθμίσεις', againBtn:'Ξανά', reviewBtn:'Δες τις απαντήσεις',
    dragHint:'Σύρε μια λέξη σε ένα κουτί — ή πάτησέ τη και μετά πάτα το κουτί.',
    typeHint:'Γράψε την απάντηση σε κάθε κουτί.',
    remaining:'έμειναν', pickOne:'Διάλεξε τουλάχιστον ένα σύνολο.',
    scoreSub:'σωστά από', timeUp:'Ο χρόνος τελείωσε!' },
  en:{ navHome:'Home', navQuiz:'Quizzes', navCore:'AWS Quiz',
    title:'AWS Cloud Practitioner — Ορολογίες',
    subtitle:'Match each description to the right AWS term. Drag the words or type the answer — CLF-C02 practice.',
    pickSets:'Pick sets', selectAll:'Select all', clearAll:'Clear',
    optionsH:'Options', modeLabel:'Mode:', modeDrag:'Drag', modeType:'Type',
    shuffleLabel:'Shuffle order', timerLabel:'Timer', minsLabel:'minutes',
    startBtn:'Start', bankH:'Words', checkBtn:'Check', retryBtn:'Clear',
    backBtn:'← Options', againBtn:'Again', reviewBtn:'Show answers',
    dragHint:'Drag a word onto a box — or tap the word, then tap the box.',
    typeHint:'Type the answer in each box.',
    remaining:'left', pickOne:'Pick at least one set.',
    scoreSub:'correct out of', timeUp:'Time is up!' },
};
// Brave/Chromium can throw a SecurityError on localStorage under file://
let lang = 'el';
try { lang = localStorage.getItem('lang') || 'el'; } catch(e) {}
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.el[k] || k;

/* =====================  STATE  ===================== */
let picked = new Set(SETS.map(s=>s.id));
let mode = 'drag';
let slots = [];          // {setId,label,answer,alias,placed,el}
let selectedWord = null; // DOM node
let timerId = null, secsLeft = 0;

/* =====================  HELPERS  ===================== */
const $ = id => document.getElementById(id);
function norm(s){
  return String(s||'').toLowerCase().replace(/&/g,' and ')
    .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
function rawnorm(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }
function matches(item, val){
  // Raw comparison first: symbol-only answers such as * and .. normalize to an
  // empty string, so they can only be matched on their literal form.
  const raw = rawnorm(val);
  const v = norm(val);
  const cands = [item.answer].concat(item.alias || []);
  return cands.some(a => (raw && raw === rawnorm(a)) || (v && v === norm(a)));
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(I18N[lang] && I18N[lang][k]) el.textContent = I18N[lang][k];
  });
  $('langBtn').textContent = lang==='el' ? 'EN' : 'EL';
  document.documentElement.lang = lang;
  buildChips(); updateSummary();
  $('dragHint').textContent = mode==='drag' ? t('dragHint') : t('typeHint');
}

/* =====================  SETUP  ===================== */
function buildChips(){
  const bar = $('setChips'); bar.innerHTML='';
  SETS.forEach(s=>{
    const b=document.createElement('button');
    b.className='chip'+(picked.has(s.id)?' on':'');
    b.innerHTML = (lang==='el'?s.titleEl:s.titleEn)+'<span class="cnt">'+s.items.length+'</span>';
    b.addEventListener('click',()=>{
      if(picked.has(s.id)) picked.delete(s.id); else picked.add(s.id);
      buildChips(); updateSummary();
    });
    bar.appendChild(b);
  });
}
function updateSummary(){
  const n = SETS.filter(s=>picked.has(s.id)).reduce((a,s)=>a+s.items.length,0);
  $('pickSummary').textContent = picked.size ? (n+' '+(lang==='el'?'θέσεις':'slots')) : t('pickOne');
  $('startBtn').disabled = picked.size===0;
}

/* =====================  BOARD  ===================== */
function buildBoard(){
  const board = $('board'); board.innerHTML=''; slots=[];
  const doShuffle = $('shuffleChk').checked;

  SETS.filter(s=>picked.has(s.id)).forEach(s=>{
    const wrap=document.createElement('div'); wrap.className='set panel';
    const h=document.createElement('p'); h.className='set-title';
    h.textContent = lang==='el'?s.titleEl:s.titleEn; wrap.appendChild(h);
    const note=document.createElement('p'); note.className='set-note';
    note.textContent = lang==='el'?s.noteEl:s.noteEn; wrap.appendChild(note);

    const grid=document.createElement('div');
    grid.className='slots'+(s.two?' two':'');
    const items = doShuffle ? shuffle(s.items) : s.items;

    items.forEach(it=>{
      const slot=document.createElement('div'); slot.className='slot';
      const lab=document.createElement('div'); lab.className='slot-label'; lab.textContent=it.label;
      const drop=document.createElement('div'); drop.className='slot-drop';
      const rec={setId:s.id,label:it.label,answer:it.answer,alias:it.alias||[],
                 placed:null,slotEl:slot,dropEl:drop};

      if(mode==='type'){
        const inp=document.createElement('input');
        inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false;
        inp.setAttribute('aria-label',it.label);
        drop.appendChild(inp); rec.input=inp;
      }else{
        drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
        drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
        drop.addEventListener('drop',e=>{
          e.preventDefault(); drop.classList.remove('over');
          const w=document.querySelector('.word[data-wid="'+e.dataTransfer.getData('text/plain')+'"]');
          if(w) placeWord(w,rec);
        });
        drop.addEventListener('click',()=>{ if(selectedWord) placeWord(selectedWord,rec); });
      }
      slot.appendChild(lab); slot.appendChild(drop); grid.appendChild(slot);
      slots.push(rec);
    });
    wrap.appendChild(grid); board.appendChild(wrap);
  });

  buildBank();
  $('dragHint').textContent = mode==='drag' ? t('dragHint') : t('typeHint');
  $('bankPanel').classList.toggle('hidden', mode==='type' && false);
  $('bank').classList.toggle('hidden', mode==='type');
  updateRemaining();
}

function buildBank(){
  const bank=$('bank'); bank.innerHTML=''; selectedWord=null;
  if(mode==='type'){ updateRemaining(); return; }
  const words = shuffle(slots.map((s,i)=>({txt:s.answer,i:i})));
  words.forEach((w,idx)=>{
    const el=document.createElement('div');
    el.className='word'; el.textContent=w.txt; el.draggable=true;
    el.dataset.wid='w'+idx; el.dataset.txt=w.txt;
    el.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain',el.dataset.wid);
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('click',()=>{
      if(selectedWord===el){ el.classList.remove('sel'); selectedWord=null; return; }
      if(selectedWord) selectedWord.classList.remove('sel');
      selectedWord=el; el.classList.add('sel');
    });
    bank.appendChild(el);
  });
}

function placeWord(wordEl, rec){
  if(rec.placed) returnWord(rec);            // free the slot first
  rec.placed = wordEl.dataset.txt;
  wordEl.classList.add('used');
  rec.wordEl = wordEl;
  rec.dropEl.innerHTML='';
  const chip=document.createElement('span');
  chip.className='placed'; chip.textContent=rec.placed;
  chip.title = lang==='el'?'Κλικ για αφαίρεση':'Click to remove';
  chip.addEventListener('click',()=>returnWord(rec));
  rec.dropEl.appendChild(chip);
  if(selectedWord){ selectedWord.classList.remove('sel'); selectedWord=null; }
  rec.slotEl.classList.remove('ok','bad');
  updateRemaining();
}
function returnWord(rec){
  if(!rec.placed) return;
  if(rec.wordEl) rec.wordEl.classList.remove('used');
  rec.placed=null; rec.wordEl=null; rec.dropEl.innerHTML='';
  rec.slotEl.classList.remove('ok','bad');
  updateRemaining();
}
function updateRemaining(){
  if(mode==='type'){ $('remainCount').textContent=''; return; }
  const left = slots.filter(s=>!s.placed).length;
  $('remainCount').textContent = left+' '+t('remaining');
}

/* =====================  TIMER  ===================== */
function startTimer(mins){
  secsLeft = mins*60;
  $('timerBox').classList.remove('hidden');
  paintTimer();
  timerId = setInterval(()=>{
    secsLeft--; paintTimer();
    if(secsLeft<=0){ clearInterval(timerId); timerId=null; checkAll(true); }
  },1000);
}
function paintTimer(){
  const m=Math.floor(secsLeft/60), s=secsLeft%60;
  const box=$('timerBox');
  box.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  box.classList.toggle('low', secsLeft<=30);
}
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} $('timerBox').classList.add('hidden'); }

/* =====================  CHECK  ===================== */
function checkAll(auto){
  let ok=0;
  slots.forEach(rec=>{
    const val = mode==='type' ? (rec.input?rec.input.value:'') : (rec.placed||'');
    const good = matches(rec,val);
    rec.slotEl.classList.toggle('ok',good);
    rec.slotEl.classList.toggle('bad',!good);
    const old=rec.dropEl.querySelector('.fix'); if(old) old.remove();
    if(!good){
      const f=document.createElement('small'); f.className='fix'; f.textContent='✓ '+rec.answer;
      rec.dropEl.appendChild(f);
    }
    if(good) ok++;
  });
  stopTimer();
  const pct = slots.length ? Math.round(ok/slots.length*100) : 0;
  $('scoreNum').textContent = pct+'%';
  $('scoreSub').textContent = (auto? t('timeUp')+' ' : '') + ok+' '+t('scoreSub')+' '+slots.length;
  $('resultView').classList.remove('hidden');
  $('resultView').scrollIntoView({behavior:'smooth',block:'center'});
}

/* =====================  WIRING  ===================== */
$('allBtn').addEventListener('click',()=>{picked=new Set(SETS.map(s=>s.id));buildChips();updateSummary();});
$('noneBtn').addEventListener('click',()=>{picked=new Set();buildChips();updateSummary();});
document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); mode=b.dataset.mode;
    $('dragHint').textContent = mode==='drag' ? t('dragHint') : t('typeHint');
  });
});
$('timerChk').addEventListener('change',e=>{
  $('timerMins').disabled = !e.target.checked;
  $('timerMinsWrap').style.opacity = e.target.checked ? '1' : '.45';
});
$('startBtn').addEventListener('click',()=>{
  if(!picked.size) return;
  buildBoard();
  $('setupView').classList.add('hidden');
  $('playView').classList.remove('hidden');
  $('resultView').classList.add('hidden');
  stopTimer();
  if($('timerChk').checked){
    const m=Math.max(1,Math.min(90,parseInt($('timerMins').value)||5));
    startTimer(m);
  }
  window.scrollTo({top:0,behavior:'smooth'});
});
$('checkBtn').addEventListener('click',()=>checkAll(false));
$('retryBtn').addEventListener('click',()=>{
  slots.forEach(rec=>{
    rec.slotEl.classList.remove('ok','bad');
    const f=rec.dropEl.querySelector('.fix'); if(f) f.remove();
    if(mode==='type'){ if(rec.input) rec.input.value=''; } else returnWord(rec);
  });
  $('resultView').classList.add('hidden');
});
$('backBtn').addEventListener('click',()=>{
  stopTimer();
  $('playView').classList.add('hidden');
  $('resultView').classList.add('hidden');
  $('setupView').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});
$('againBtn').addEventListener('click',()=>{ $('retryBtn').click(); buildBank();
  if($('timerChk').checked){ stopTimer();
    startTimer(Math.max(1,Math.min(90,parseInt($('timerMins').value)||5))); }
  window.scrollTo({top:0,behavior:'smooth'});
});
$('reviewBtn').addEventListener('click',()=>{
  $('board').scrollIntoView({behavior:'smooth',block:'start'});
});
$('langBtn').addEventListener('click',()=>{
  lang = lang==='el'?'en':'el';
  try{ localStorage.setItem('lang',lang); }catch(e){}
  applyI18n();
  if(!$('playView').classList.contains('hidden')) buildBoard();
});

applyI18n();
buildChips();
updateSummary();
</script>
</body>
</html>
